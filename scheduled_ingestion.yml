name: Scheduled Data Ingestion

on:
  schedule:
    # Run every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

jobs:
  ingest_data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Ingestion Pipeline
        run: |
          python -m src.ingestion.pipeline
        # We don't need GROQ_API_KEY because ingestion uses local HuggingFace embeddings

      - name: Commit updated Vector DB to repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update Mutual Fund RAG Vector DB [skip ci]"
          file_pattern: "data/chroma/*"
